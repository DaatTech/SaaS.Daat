<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DAAT. — Painel de Acompanhamento</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  :root {
    --bg: #f3ecdd; --bg2: #fffdf6; --bg3: #ffffff;
    --border: rgba(20,18,12,0.10); --border2: rgba(20,18,12,0.16);
    --text: #14120c; --text2: #5c5748; --text3: #8d8672;
    --accent: #f5c400; --accent2: #ffd633;
    --green: #7a9b6e; --red: #c98a7a; --amber: #c99a4a; --sage: #93a884;
    --radius: 14px; --radius-sm: 8px;
    --shadow: 0 1px 2px rgba(20,18,12,.04), 0 8px 24px -12px rgba(20,18,12,.12);
    --font-title: 'Archivo Black', sans-serif; --font-mono: 'IBM Plex Mono', monospace; --font-body: 'Inter', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font-body); background: var(--bg); color: var(--text); min-height: 100vh; font-size: 14px;
    background-image: linear-gradient(rgba(20,18,12,0.035) 1px, transparent 1px), linear-gradient(90deg, rgba(20,18,12,0.035) 1px, transparent 1px);
    background-size: 24px 24px;
  }
  header { background: rgba(255,253,246,.85); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); padding: 0 2rem; display: flex; align-items: center; justify-content: space-between; height: 72px; position: sticky; top: 0; z-index: 100; }
  .logo-word { font-family: var(--font-title); font-size: 24px; }
  .logo-word .dot { color: var(--accent); }
  .header-sup { font-size: 10px; color: var(--text3); font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 0.08em; }
  .container { max-width: 1300px; margin: 0 auto; padding: 2rem; }
  .card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.75rem; margin-bottom: 1.25rem; box-shadow: var(--shadow); }
  .card-title { font-size: 14px; font-weight: 700; margin-bottom: 1.25rem; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 9px 18px; border-radius: 999px; font-size: 13px; font-weight: 700; cursor: pointer; border: none; font-family: var(--font-body); }
  .btn-gold { background: var(--accent); color: var(--text); }
  .btn-outline { background: transparent; border: 1px solid var(--border2); color: var(--text2); }
  .btn-sm { padding: 6px 12px; font-size: 12px; }
  input, select { background: var(--bg3); border: 1px solid var(--border2); border-radius: var(--radius-sm); color: var(--text); font-family: var(--font-body); font-size: 13px; padding: 7px 10px; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th { text-align: left; font-size: 9.5px; font-weight: 700; color: var(--text3); text-transform: uppercase; letter-spacing: .06em; padding: 9px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; font-family: var(--font-mono); }
  td { padding: 9px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tr:hover td { background: rgba(20,18,12,.02); }
  .badge { display: inline-flex; padding: 3px 9px; border-radius: 999px; font-size: 10.5px; font-weight: 600; }
  .badge-green { background: rgba(122,155,110,.16); color: var(--green); }
  .badge-red { background: rgba(201,138,122,.16); color: var(--red); }
  .badge-amber { background: rgba(201,154,74,.16); color: var(--amber); }
  .badge-gray { background: rgba(20,18,12,.06); color: var(--text3); }
  .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 1.5rem; }
  .metric { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.1rem 1.3rem; box-shadow: var(--shadow); }
  .metric-label { font-size: 9.5px; color: var(--text3); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 8px; font-family: var(--font-mono); }
  .metric-value { font-size: 22px; font-family: var(--font-title); }
  input.mini { width: 90px; padding: 4px 6px; font-size: 12px; }
  #login-screen { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 999; }
  #login-box { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 2.5rem; width: 100%; max-width: 360px; box-shadow: var(--shadow); text-align: center; }
  #login-box .form-group { margin: 14px 0; text-align: left; }
  #login-box label { font-size: 10px; font-family: var(--font-mono); text-transform: uppercase; color: var(--text3); display: block; margin-bottom: 5px; }
  #login-box input { width: 100%; }
  #login-error { color: var(--red); font-size: 12px; margin-top: 10px; }
  #app-wrap { display: none; }
</style>
</head>
<body>

<div id="login-screen">
  <div id="login-box">
    <div class="logo-word" style="font-size:28px;">DAAT<span class="dot">.</span></div>
    <div class="header-sup" style="margin-top:4px;">Painel de Acompanhamento</div>
    <div class="form-group">
      <label>E-mail</label>
      <input id="login-email" type="email" style="width:100%;" />
    </div>
    <div class="form-group">
      <label>Senha</label>
      <input id="login-senha" type="password" style="width:100%;" onkeydown="if(event.key==='Enter') fazerLogin()" />
    </div>
    <button class="btn btn-gold" style="width:100%;justify-content:center;" onclick="fazerLogin()">Entrar</button>
    <div id="login-error"></div>
  </div>
</div>

<div id="app-wrap">
<header>
  <div>
    <div class="logo-word">DAAT<span class="dot">.</span></div>
    <div class="header-sup">Painel de Acompanhamento</div>
  </div>
  <button class="btn btn-outline btn-sm" onclick="sair()"><i class="ti ti-logout"></i> Sair</button>
</header>

<div class="container">

  <div class="metrics" id="metricas"></div>

  <div class="card">
    <div class="card-title">
      <span><i class="ti ti-building-store"></i> Clientes</span>
      <div style="display:flex;gap:8px;">
        <select id="f-status" onchange="renderTabela()">
          <option value="">Todos os status</option>
          <option value="ativo">Ativo</option>
          <option value="inadimplente">Inadimplente</option>
        </select>
        <select id="f-teste" onchange="renderTabela()">
          <option value="">Teste + pagantes</option>
          <option value="teste">Só em teste</option>
          <option value="pagante">Só pagantes (fora do teste)</option>
        </select>
        <button class="btn btn-outline btn-sm" onclick="exportarExcel()"><i class="ti ti-download"></i> Exportar</button>
      </div>
    </div>
    <div style="overflow-x:auto;">
      <table id="tabela-clientes">
        <thead>
          <tr>
            <th>Empresa</th>
            <th>Responsável</th>
            <th>Cadastro</th>
            <th>Teste até</th>
            <th>Status</th>
            <th>Valor mensal</th>
            <th>Último pagamento</th>
            <th>Salvar</th>
          </tr>
        </thead>
        <tbody id="tabela-body"></tbody>
      </table>
    </div>
  </div>

  <div class="card">
    <div class="card-title">
      <span><i class="ti ti-message-2"></i> Chamados de suporte</span>
      <select id="f-chamado-status" onchange="renderChamadosAdmin()">
        <option value="">Todos os status</option>
        <option value="aberto">Abertos</option>
        <option value="respondido">Respondidos</option>
        <option value="fechado">Fechados</option>
      </select>
    </div>
    <div id="chamados-admin-lista"></div>
  </div>

</div>
</div>

<script>
const SUPABASE_URL = 'https://mdekuwxqqdbokbzsibrh.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1kZWt1d3hxcWRib2tienNpYnJoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc2NjM0NzQsImV4cCI6MjEwMzIzOTQ3NH0.zMkm02EAvDsOw3pCBg9h1QxTZbW_gcYUZXfJl-8WCfo';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let clientes = [];
let chamadosAdmin = [];

// ===== SEGURANÇA: escapa texto do usuário antes de inserir na página (previne XSS) =====
function escapeHTML(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function hojeLocal() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

async function fazerLogin() {
  const email = document.getElementById('login-email').value.trim();
  const senha = document.getElementById('login-senha').value;
  const errEl = document.getElementById('login-error');
  errEl.textContent = '';
  const { error } = await supabaseClient.auth.signInWithPassword({ email, password: senha });
  if (error) { errEl.textContent = 'E-mail ou senha incorretos.'; return; }
  await iniciar();
}

async function sair() {
  await supabaseClient.auth.signOut();
  document.getElementById('app-wrap').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
}

async function iniciar() {
  // tenta buscar todas as organizações — só funciona se o usuário estiver na tabela "admins"
  const { data, error } = await supabaseClient
    .from('organizacoes')
    .select('id, nome, criado_em, status, em_teste, trial_fim, valor_mensal, ultimo_pagamento')
    .order('criado_em', { ascending: false });

  if (error || !data) {
    document.getElementById('login-error').textContent = 'Erro ao carregar dados. Você tem certeza que está cadastrado como admin?';
    return;
  }

  const { data: perfisData } = await supabaseClient.from('perfis').select('organizacao_id, nome');
  const nomesPorOrg = {};
  (perfisData || []).forEach(p => { nomesPorOrg[p.organizacao_id] = p.nome; });

  clientes = data.map(o => ({ ...o, responsavel: nomesPorOrg[o.id] || '' }));

  // se só retornou a própria organização (1 linha), provavelmente não é admin
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app-wrap').style.display = 'block';
  renderMetricas();
  renderTabela();
  await carregarChamadosAdmin();
}

function diasRestantes(trialFim) {
  const hoje = new Date(hojeLocal() + 'T00:00:00');
  const fim = new Date(trialFim + 'T00:00:00');
  return Math.round((fim - hoje) / 86400000);
}

function renderMetricas() {
  const total = clientes.length;
  const emTeste = clientes.filter(c => c.em_teste && diasRestantes(c.trial_fim) >= 0).length;
  const testeExpirado = clientes.filter(c => c.em_teste && diasRestantes(c.trial_fim) < 0).length;
  const pagantes = clientes.filter(c => !c.em_teste).length;
  const ativos = clientes.filter(c => c.status === 'ativo').length;
  const inadimplentes = clientes.filter(c => c.status === 'inadimplente').length;
  const receitaMensal = clientes.filter(c => !c.em_teste && c.status === 'ativo').reduce((s,c) => s + Number(c.valor_mensal || 0), 0);

  document.getElementById('metricas').innerHTML = `
    <div class="metric"><div class="metric-label">Total de clientes</div><div class="metric-value">${total}</div></div>
    <div class="metric"><div class="metric-label">Em teste grátis</div><div class="metric-value" style="color:var(--amber);">${emTeste}</div></div>
    <div class="metric"><div class="metric-label">Teste expirado</div><div class="metric-value" style="color:var(--red);">${testeExpirado}</div></div>
    <div class="metric"><div class="metric-label">Pagantes</div><div class="metric-value" style="color:var(--sage);">${pagantes}</div></div>
    <div class="metric"><div class="metric-label">Inadimplentes</div><div class="metric-value" style="color:var(--red);">${inadimplentes}</div></div>
    <div class="metric"><div class="metric-label">Receita mensal (ativos)</div><div class="metric-value">R$ ${receitaMensal.toFixed(2)}</div></div>
  `;
}

function renderTabela() {
  const fStatus = document.getElementById('f-status').value;
  const fTeste = document.getElementById('f-teste').value;
  let lista = [...clientes];
  if (fStatus) lista = lista.filter(c => c.status === fStatus);
  if (fTeste === 'teste') lista = lista.filter(c => c.em_teste);
  if (fTeste === 'pagante') lista = lista.filter(c => !c.em_teste);

  let h = '';
  lista.forEach(c => {
    const dias = diasRestantes(c.trial_fim);
    let testeBadge = '';
    if (c.em_teste) {
      testeBadge = dias >= 0
        ? `<span class="badge badge-amber">${dias}d restantes</span>`
        : `<span class="badge badge-red">expirado há ${Math.abs(dias)}d</span>`;
    } else {
      testeBadge = `<span class="badge badge-gray">pagante</span>`;
    }
    const statusBadge = c.status === 'ativo'
      ? '<span class="badge badge-green">Ativo</span>'
      : '<span class="badge badge-red">Inadimplente</span>';

    h += `<tr>
      <td style="font-weight:600;">${escapeHTML(c.nome)}</td>
      <td>${escapeHTML(c.responsavel) || '—'}</td>
      <td style="font-family:var(--font-mono);font-size:11px;">${(c.criado_em||'').split('T')[0].split('-').reverse().join('/')}</td>
      <td>${testeBadge}</td>
      <td>
        <select class="mini" id="status-${c.id}" style="width:120px;">
          <option value="ativo" ${c.status==='ativo'?'selected':''}>Ativo</option>
          <option value="inadimplente" ${c.status==='inadimplente'?'selected':''}>Inadimplente</option>
        </select>
      </td>
      <td><input class="mini" id="valor-${c.id}" type="number" step="0.01" value="${c.valor_mensal}" /></td>
      <td><input class="mini" id="pag-${c.id}" type="date" value="${c.ultimo_pagamento || ''}" /></td>
      <td><button class="btn btn-gold btn-sm" onclick="salvarLinha('${c.id}')"><i class="ti ti-check"></i></button></td>
    </tr>`;
  });
  document.getElementById('tabela-body').innerHTML = h || '<tr><td colspan="8" style="text-align:center;color:var(--text3);padding:2rem;">Nenhum cliente encontrado</td></tr>';
}

async function salvarLinha(id) {
  const status = document.getElementById(`status-${id}`).value;
  const valor = parseFloat(document.getElementById(`valor-${id}`).value) || 0;
  const pag = document.getElementById(`pag-${id}`).value || null;

  const { error } = await supabaseClient.from('organizacoes')
    .update({ status, valor_mensal: valor, ultimo_pagamento: pag })
    .eq('id', id);

  if (error) { alert('Erro ao salvar: ' + error.message); return; }

  const c = clientes.find(x => x.id === id);
  if (c) { c.status = status; c.valor_mensal = valor; c.ultimo_pagamento = pag; }
  renderMetricas();
  renderTabela();
}

function exportarExcel() {
  const linhas = clientes.map(c => ({
    'Empresa': c.nome,
    'Responsável': c.responsavel || '',
    'Cadastro': (c.criado_em||'').split('T')[0],
    'Em teste': c.em_teste ? 'Sim' : 'Não',
    'Teste até': c.trial_fim,
    'Status': c.status,
    'Valor mensal': c.valor_mensal,
    'Último pagamento': c.ultimo_pagamento || '',
  }));
  const ws = XLSX.utils.json_to_sheet(linhas);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Clientes DAAT');
  XLSX.writeFile(wb, `daat-acompanhamento-${hojeLocal()}.xlsx`);
}

async function carregarChamadosAdmin() {
  const { data, error } = await supabaseClient
    .from('chamados')
    .select('id, organizacao_id, usuario_email, assunto, mensagem, status, resposta, criado_em')
    .order('criado_em', { ascending: false });

  if (error || !data) { chamadosAdmin = []; return; }

  const nomesPorOrg = {};
  clientes.forEach(c => { nomesPorOrg[c.id] = c.nome; });
  chamadosAdmin = data.map(c => ({ ...c, empresaNome: nomesPorOrg[c.organizacao_id] || '—' }));
  renderChamadosAdmin();
}

function renderChamadosAdmin() {
  const wrap = document.getElementById('chamados-admin-lista');
  if (!wrap) return;
  const filtro = document.getElementById('f-chamado-status').value;
  let lista = [...chamadosAdmin];
  if (filtro) lista = lista.filter(c => c.status === filtro);

  if (!lista.length) {
    wrap.innerHTML = '<div style="text-align:center;color:var(--text3);padding:2rem;">Nenhum chamado encontrado</div>';
    return;
  }

  const statusCls = { 'aberto': 'badge-amber', 'respondido': 'badge-green', 'fechado': 'badge-gray' };
  let h = '';
  lista.forEach(c => {
    h += `<div style="border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 16px;margin-bottom:10px;">
      <div style="display:flex;justify-content:space-between;align-items:start;gap:10px;margin-bottom:6px;">
        <div>
          <div style="font-weight:700;font-size:13px;">${escapeHTML(c.assunto)}</div>
          <div style="font-size:11px;color:var(--text3);font-family:var(--font-mono);margin-top:2px;">${escapeHTML(c.empresaNome)} · ${escapeHTML(c.usuario_email) || ''} · ${new Date(c.criado_em).toLocaleDateString('pt-BR')}</div>
        </div>
        <span class="badge ${statusCls[c.status] || 'badge-gray'}">${c.status}</span>
      </div>
      <div style="font-size:12.5px;color:var(--text2);margin-bottom:10px;">${escapeHTML(c.mensagem)}</div>
      <textarea id="resp-${c.id}" placeholder="Escreva a resposta..." style="width:100%;min-height:60px;margin-bottom:8px;">${escapeHTML(c.resposta) || ''}</textarea>
      <div style="display:flex;gap:8px;align-items:center;">
        <select id="status-${c.id}" class="mini" style="width:130px;">
          <option value="aberto" ${c.status==='aberto'?'selected':''}>Aberto</option>
          <option value="respondido" ${c.status==='respondido'?'selected':''}>Respondido</option>
          <option value="fechado" ${c.status==='fechado'?'selected':''}>Fechado</option>
        </select>
        <button class="btn btn-gold btn-sm" onclick="salvarRespostaChamado('${c.id}')"><i class="ti ti-check"></i> Salvar</button>
      </div>
    </div>`;
  });
  wrap.innerHTML = h;
}

async function salvarRespostaChamado(id) {
  const resposta = document.getElementById(`resp-${id}`).value.trim();
  const status = document.getElementById(`status-${id}`).value;

  const { error } = await supabaseClient.from('chamados')
    .update({ resposta, status, respondido_em: new Date().toISOString() })
    .eq('id', id);

  if (error) { alert('Erro ao salvar: ' + error.message); return; }

  const c = chamadosAdmin.find(x => x.id === id);
  if (c) { c.resposta = resposta; c.status = status; }
  renderChamadosAdmin();
}

(async function checkSession() {
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (session) await iniciar();
})();
</script>
</body>
</html>
